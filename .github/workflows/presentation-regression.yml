name: Presentation Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  presentation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run presentation regression tests
        run: npm test
